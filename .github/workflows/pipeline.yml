name: Eternalist Foundry

on:
  workflow_call:
    inputs:
      contract:
        description: Repository-relative Foundry contract.
        required: false
        type: string
        default: foundry.toml
      namespace:
        description: Collision-free evidence namespace for repositories with several products.
        required: false
        type: string
        default: product

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Forge proof graph
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.proofs }}
    steps:
      - name: Check out product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Raise Foundry
        uses: $/.github/actions/bootstrap
        with:
          engine: ${{ job.workflow_sha }}
      - name: Forge proof matrix
        id: plan
        shell: bash
        env:
          FOUNDRY_CONTRACT: ${{ inputs.contract }}
          FOUNDRY_NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          [[ $FOUNDRY_NAMESPACE =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          foundry --contract "$FOUNDRY_CONTRACT" plan \
            --format human \
            --github-output "$GITHUB_OUTPUT"

  proof:
    name: Proof · ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Check out product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Raise Foundry
        uses: $/.github/actions/bootstrap
        with:
          engine: ${{ job.workflow_sha }}
      - name: Install cross target
        if: ${{ matrix.cross }}
        shell: bash
        env:
          FOUNDRY_TARGET: ${{ matrix.target }}
        run: rustup target add "$FOUNDRY_TARGET"
      - name: Restore trusted Rust cache
        if: ${{ !contains(matrix.laws, 'security') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Raise Linux substrate
        if: ${{ runner.os == 'Linux' && (matrix.setup != 'ordinary' || join(matrix.packages, ' ') != '') }}
        shell: bash
        env:
          FOUNDRY_SETUP: ${{ matrix.setup }}
          FOUNDRY_PACKAGES: ${{ join(matrix.packages, ' ') }}
        run: |
          read -ra packages <<<"$FOUNDRY_PACKAGES"
          bash "$FOUNDRY_ENGINE_ROOT/scripts/ci/setup-linux" "$FOUNDRY_SETUP" "${packages[@]}"
      - name: Install pinned dependency auditor
        if: ${{ contains(matrix.laws, 'security') }}
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.2
      - name: Install pinned workflow linter
        if: ${{ contains(matrix.laws, 'source') }}
        shell: bash
        run: |
          set -euo pipefail
          bindir="$RUNNER_TEMP/foundry-tools"
          mkdir -p "$bindir"
          GOBIN="$bindir" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$bindir/actionlint" --version
          printf '%s\n' "$bindir" >> "$GITHUB_PATH"
      - name: Validate product workflows
        if: ${{ contains(matrix.laws, 'source') }}
        shell: bash
        run: actionlint
      - name: Install pinned native packager
        if: ${{ contains(matrix.laws, 'artifact') && (matrix.delivery == 'dmg' || matrix.delivery == 'nsis-current-user') }}
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-packager@0.11.8
      - name: Execute and seal proof
        shell: bash
        env:
          FOUNDRY_CONTRACT: ${{ inputs.contract }}
          FOUNDRY_PROOF_NAME: ${{ matrix.proof }}
          FOUNDRY_PROOF_COORDINATE: ${{ matrix.coordinate }}
          FOUNDRY_EVIDENCE_ROOT: ${{ runner.temp }}/foundry-evidence
        run: >-
          bash "$FOUNDRY_ENGINE_ROOT/scripts/ci/run-proof"
          "$FOUNDRY_CONTRACT"
          "$FOUNDRY_PROOF_NAME"
          "$FOUNDRY_PROOF_COORDINATE"
          "$FOUNDRY_EVIDENCE_ROOT"
      - name: Retain sealed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-${{ inputs.namespace }}-proof-${{ matrix.id }}
          path: ${{ runner.temp }}/foundry-evidence
          if-no-files-found: error
          retention-days: 14

  verdict:
    name: Foundry verdict
    if: ${{ always() }}
    needs:
      - plan
      - proof
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Raise Foundry
        uses: $/.github/actions/bootstrap
        with:
          engine: ${{ job.workflow_sha }}
      - name: Recover proof cells
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: foundry-${{ inputs.namespace }}-proof-*
          path: ${{ runner.temp }}/foundry-evidence
          merge-multiple: true
      - name: Judge evidence into the support manifest
        shell: bash
        env:
          FOUNDRY_CONTRACT: ${{ inputs.contract }}
          FOUNDRY_EVIDENCE_ROOT: ${{ runner.temp }}/foundry-evidence
          FOUNDRY_SUPPORT: ${{ runner.temp }}/foundry-verdict/support.json
        run: >-
          foundry --contract "$FOUNDRY_CONTRACT" support
          "$FOUNDRY_EVIDENCE_ROOT"
          "$FOUNDRY_SUPPORT"
      - name: Retain public support manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-${{ inputs.namespace }}-support
          path: ${{ runner.temp }}/foundry-verdict/support.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish judged release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: verdict
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Raise Foundry
        uses: $/.github/actions/bootstrap
        with:
          engine: ${{ job.workflow_sha }}
      - name: Recover proof cells
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: foundry-${{ inputs.namespace }}-proof-*
          path: ${{ runner.temp }}/foundry-evidence
          merge-multiple: true
      - name: Stage judged assets
        shell: bash
        env:
          FOUNDRY_CONTRACT: ${{ inputs.contract }}
          FOUNDRY_NAMESPACE: ${{ inputs.namespace }}
          FOUNDRY_EVIDENCE_ROOT: ${{ runner.temp }}/foundry-evidence
          FOUNDRY_RELEASE_STAGE: ${{ runner.temp }}/foundry-release
        run: |
          set -euo pipefail
          foundry --contract "$FOUNDRY_CONTRACT" stage \
            "$FOUNDRY_EVIDENCE_ROOT" \
            "$FOUNDRY_RELEASE_STAGE"
          if [[ $FOUNDRY_NAMESPACE != product ]]; then
            mv "$FOUNDRY_RELEASE_STAGE/support.json" \
              "$FOUNDRY_RELEASE_STAGE/support-$FOUNDRY_NAMESPACE.json"
          fi
      - name: Require registry publication
        shell: bash
        env:
          FOUNDRY_NAMESPACE: ${{ inputs.namespace }}
          FOUNDRY_RELEASE_STAGE: ${{ runner.temp }}/foundry-release
        run: |
          set -euo pipefail
          manifest=$FOUNDRY_RELEASE_STAGE/support.json
          if [[ $FOUNDRY_NAMESPACE != product ]]; then
            manifest=$FOUNDRY_RELEASE_STAGE/support-$FOUNDRY_NAMESPACE.json
          fi
          package=$(jq -r .product.package "$manifest")
          version=$(jq -r .product.version "$manifest")
          publish=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -c --arg package "$package" '.packages[] | select(.name == $package) | .publish')
          if [[ $publish == '[]' ]]; then
            printf '%s is not published to a registry\n' "$package"
            exit 0
          fi
          # A publishable package reaches crates.io before a release claims it.
          cd "$RUNNER_TEMP"
          cargo info --registry crates-io "$package@$version" >/dev/null
      - name: Publish immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDRY_RELEASE_STAGE: ${{ runner.temp }}/foundry-release
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Another namespace's publisher may create the release first.
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes ||
              gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          release=$(mktemp)
          witness=$(mktemp -d)
          trap 'rm -f "$release"; rm -rf "$witness"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >"$release"
          for asset in "$FOUNDRY_RELEASE_STAGE"/*; do
            name=${asset##*/}
            url=$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .url' "$release")
            if [[ -z "$url" ]]; then
              gh release upload "$GITHUB_REF_NAME" "$asset"
              continue
            fi
            existing="$witness/$name"
            gh api -H 'Accept: application/octet-stream' "$url" >"$existing"
            if ! cmp -s "$asset" "$existing"; then
              printf 'release asset %q already exists with different bytes\n' "$name" >&2
              exit 1
            fi
          done
