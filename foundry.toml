schema = 1

[product]
name = "Eternalist Foundry"
package = "eternalist-foundry"
binary = "foundry"
profile = "portable-cli"

[coordinates]
release-tested = ["linux-x86_64"]
supported = ["macos-aarch64", "macos-x86_64", "windows-x86_64"]

[delivery]
linux = "cargo"

[[proofs]]
name = "source"
laws = ["source"]
run = ["./scripts/check"]
timeout-minutes = 20

[[proofs]]
name = "security"
laws = ["security"]
run = ["./scripts/audit"]
timeout-minutes = 15

[[proofs]]
name = "source-package"
laws = ["source-package"]
run = ["./scripts/package"]
timeout-minutes = 20

[[proofs]]
name = "host"
laws = ["host"]
run = ["cargo", "test", "--locked", "--workspace", "--all-targets", "--all-features"]
coordinates = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]
timeout-minutes = 20

[[proofs]]
name = "lifecycle"
laws = ["lifecycle"]
run = ["./scripts/verify-install"]
coordinates = ["linux-x86_64"]
timeout-minutes = 20
