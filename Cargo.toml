[workspace]
members = ["crates/eternalist-foundry"]
resolver = "3"

[workspace.package]
authors = ["eternalist <main@eternalist.moe>"]
categories = ["command-line-utilities", "development-tools"]
description = "Evidence-bearing CI and release orchestration for Eternalist products."
edition = "2024"
homepage = "https://eternalist.moe/"
keywords = ["ci", "release", "rust", "testing"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/eternalist-foundry"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1.1"

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"

# Intentional local vocabularies are cheaper than repetitive qualification.
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }

allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# House policy: glob imports are exact local notation.
enum_glob_use = "allow"
wildcard_imports = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = [
  "cargo",
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps"]
canonicalize_commands = [
  [
    "cargo",
    "fix",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--allow-dirty",
    "--allow-staged",
    "--allow-no-vcs",
  ],
  [
    "cargo",
    "clippy",
    "--fix",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--allow-dirty",
    "--allow-staged",
    "--allow-no-vcs",
  ],
  ["cargo", "fmt", "--all"],
]

[workspace.metadata.rust-starter.source_files]
max_lines = 2000
include = ["*.rs", "**/*.rs"]
exclude = []
